## Corpora

### Precondition: TEI Standard
#### (= <u>T</u>ext <u>E</u>ncoding <u>I</u>nitiative)

<br />

```xml
<stage>Eine Heide. Donner und Blitz.</stage>
<stage>Drei Hexen treten auf.</stage>
<sp who="#erste_hexe">
  <speaker>Erste Hexe.</speaker>
  <l>Wann kommen wir drei uns wieder entgegen,</l>
  <l>Im Blitz und Donner, oder im Regen?</l>
</sp>
<sp who="#zweite_hexe">
  <speaker>Zweite Hexe.</speaker>
  <l>Wenn der Wirrwarr stille schweigt,</l>
  <l>Wer der Sieger ist, sich zeigt.</l>
</sp>
<sp who="#dritte_hexe">
  <speaker>Dritte Hexe.</speaker>
  <l>Das ist, eh’ der Tag sich neigt.</l>
</sp>
```

<br />

Excerpt from Shakespeare’s Macbeth in GerShDraCor, encoded in TEI. <br />Currently, 588 different elements are defined in the TEI standard ([Version 4.12.0, July 2026](https://tei-c.org/release/doc/tei-p5-doc/en/html/REF-ELEMENTS.html)).
<!-- .element: style="font-size:0.6em;" -->

## DraCor API

<br /><br />

API: Application Programming Interface
<!-- .element: style="font-size:0.6em;" -->

--

### What is an API?

<br />

- a standardised interface for exchanging information between software components
- supports modular software development and simplifies programming
- data are exchanged in structured formats according to a defined interface
- DraCor provides a RESTful API for web-based access

--

### Functions of the DraCor API

![DraCor-API)](images/dracor-api.png)

https://dracor.org/doc/api
<!-- .element: style="font-size:0.6em;" -->

--

### DraCor-API: Example Queries

https://dracor.org/api/v1/corpora/gersh/plays/hamlet-prinz-von-daenemark/spoken-text?sex=FEMALE<!-- .element: style="font-size:0.7em;" -->

<small>Speech text of all female characters in Shakespeare’s “Hamlet”. (“Good Hamlet, cast thy nighted color off, / […]”)</small>

### Simple visualisation of structural data
#### Number of characters per play in chronological order (1/2)

<br />

```R
library(data.table)
library(ggplot2)
shakedracor <- fread("https://dracor.org/api/v1/corpora/shake/metadata/csv")
ggplot(shakedracor[], aes(x = yearNormalized, y = numOfSpeakers)) + geom_point()
```

<br />

Example of a simple R script that obtains data via the API.
<!-- .element: style="font-size:0.6em;" -->

## Ecosystem

### Concept of ‘Programmable Corpora’

<br />

<small>Publication: <br />Frank Fischer et al.: **Programmable Corpora: Introducing DraCor, an Infrastructure for the Research on <br />European Drama.** Proceedings of DH2019: “Complexities”, Utrecht, [doi:10.5281/zenodo.4284002](https://doi.org/10.5281/zenodo.4284002).</small>

<br />

- corpora as comparable objects that offer functions themselves and are linked to other data sources (e.g. via LOD)
- [FAIR principles](https://www.go-fair.org/fair-principles/)
- Programmable Corpora are not limited to the offered API, connection is possible on all levels (TEI, API, R, Python, LOD, ...)

--

### Dynamic graph of “The Merchant of Venice”

<video data-autoplay src="images/der-kaufmann-von-venedig_dynamic-graph.mp4" style="height:520px;"></video>

Generated using the [**ndtv**](https://cran.r-project.org/web/packages/ndtv/index.html) package. Data directly via **DraCor API**. Script based on work by Ivan Pozdniakov ([RPubs.com](https://rpubs.com/Pozdniakov/godunov)). <br />The Venice and Belmont clusters develop independently until they merge in III.2, when Bassanio and Gratiano arrive in Belmont.
<!-- .element: style="font-size:0.5em;" -->

### Cross-Corpus Analyses of Mythological <br />and Historical Characters

![dracor-wikidata-button](images/dracor-wikidata-button.png)<!-- .element: style="height:180px;" -->

(Source: [dracor.org/id/gersh000015](https://dracor.org/id/gersh000015))

* Description: “List plays having a character identified by Wikidata ID”

  * [dracor.org/api/v1/character/Q172248](https://dracor.org/api/v1/character/Q172248) (Marcus Brutus)

### Wikidata as a connector between projects and sources

<br />

- as of September 2026, the [Wikidata item on Macbeth](https://www.wikidata.org/wiki/Q130283) has 40 identifiers from other projects
- those projects provide many kinds of data, including …
  - bibliographic and authority data: BnF, GND, LoC, Goodreads, DraCor, …
  - performance data: Internet Broadway Database, Theatricalia, Carnegie Hall, MusicBrainz, IMDb, …
  - archival material: museum-digital, Wellcome Collection

---

## Summary

<br />

- DraCor: a digital research infrastructure/ecosystem for the study of European drama and beyond
- curated, extensible corpora in multiple languages, coupled with interfaces that support comparative research
- open data, open source, community
- further development in critical engagement with digital research possibilities
- ideally, an interface between analogue and digital philology, and between drama studies and performance studies
