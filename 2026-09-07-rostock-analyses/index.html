### Why this workshop?

<br />

* Digital drama analysis is demanding:
  * You need the right data (the more the better).
  * You need the right tools to search for interesting patterns in the data.
  * You have to »get from numbers to meaning« (Heuser/Le-Khac 2012).
  * It would be best practice if this process followed the [FAIR principles](https://en.wikipedia.org/wiki/FAIR_data).
* DraCor is meant to make all this easier.

--

### For this workshop you need:

<br />

* A laptop and browser (we will need many <br />browser tabs).
* We recommend creating a new folder for <br />downloading the data during the workshop.
* We will be working with ready-made tools and <br />customised data from DraCor.

--

## Chapter 2.1: Full-Text Data

<br />

### Voyant

--

### Task

<br />

- Open Voyant in another browser tab ([voyant-tools.org](https://voyant-tools.org/)).
- Choose a DraCor play and go to the Download tab. (example: [L.&nbsp;A.&nbsp;V. Gottsched](https://dracor.org/id/ger000462))
- Download the ›Spoken text‹ → ›Plain (no markup)‹ → TXT.
- You can also copy the URL.
- Then you can paste the text, paste the URL or upload the file to Voyant.

--

<!-- .slide: data-background-color="lightblue" -->

## Chapter 2.2: Tabular Data

<br />

### RAWGraphs

--

### Task

<br />

- Open RAWGraphs in another browser tab ([rawgraphs.io](https://www.rawgraphs.io/)).
- Choose a DraCor play and go to the Download tab. (example: [L.&nbsp;A.&nbsp;V. Gottsched](https://dracor.org/id/ger000462))
- Download the ›List of characters‹ → ›Including precalculated data‹ → CSV.
- You can also copy the URL.
- Then you can paste the URL or upload the file to RAWGraphs.

--

<!-- .slide: data-background-color="lightblue" -->

## Chapter 4.1: Corpus Analysis

<br />

### AntConc

--

### Task

<br />

- Download and install AntConc ([laurenceanthony.net/software/antconc/](https://www.laurenceanthony.net/software/antconc/)).
- Download data from the DraCor Download tab or via the DraCor API.
- Open files in AntConc to build your working corpus.

--

<!-- .slide: data-background-color="lightblue" -->

## Chapter 4.2: Stylometry

<br />

### stylo

--

### Task

<br />

- Download and install stylo ([github.com/computationalstylistics/stylo](https://github.com/computationalstylistics/stylo)), preferably with RStudio already installed.
- Download data from the DraCor Download tab or via the DraCor API. They can be full texts or slices of texts.
- Use a function like `stylo()` or `oppose()` to do your analysis.
