### Website Sustainability

<br />

- hosted for 25 years on servers of the Natural Language Processing department of Leipzig University
- domain name retained, even though the server has moved several times
- PHP used server-side (from PHP 4 in 2001 to PHP 8 in 2026)
- formerly updated via FTP; since 2022, deployed via Git repository (new firewall not allowing external access to web server any more)
- no database involved

--

![histvv](images/histvv.png)<!-- .element: style="height:400px;" -->

Course catalogues as sources for discipline-based scholarship: The differentiation of academic disciplines at the University of Leipzig, 1814/15–1914

([histvv.uni-leipzig.de](https://histvv.uni-leipzig.de/), funded by DFG from 2007–2009)

--

### Website and Database Sustainability

<br />

- move from Gentoo to CentOS
- migration from Berkeley DB XML to BaseX
- porting the mod_perl part of the application to Node.js
- move from SVN to Git
- Git repositories for code and data and corresponding deployment process

# Sustainability Failures

--

### Project Bamboo (2008–2012)

<br />

- funded by the Mellon Foundation
- set out to create a shared digital infrastructure for humanities research
- instead of every DH project building “yet another database” or “yet another website”, common technical services could be developed once and reused across institutions and projects
- initial interest was much greater than expected
- concluded in 2012 without having achieved its most ambitious goals
- former project member Quinn Dombrowski (now Quinn Daedal) provided a comprehensive analysis of the project’s failure
- What Ever Happened to Project Bamboo? In: Literary and Linguistic Computing. Volume 29, issue 3 (September 2014), pp. 326–339, ([doi:10.1093/llc/fqu026](https://doi.org/10.1093/llc/fqu026))

--

### DiRT

<br />

- [Digital Research Tools (DiRT) wiki](https://digitalresearchtools.pbworks.com/) → [Bamboo DiRT](https://web.archive.org/web/20120113204004/https://dirt.projectbamboo.org/) → [DiRT Directory](https://web.archive.org/web/20140712050641/http://dirtdirectory.org/) → [TAPoR 3.0](https://tapor.ca/)
- in 2018, the contents of DiRT were ingested into TAPoR
- Kaitlyn Grant et al.: Absorbing DiRT: Tool Directories in the Digital Age. In: Digital Studies/Le champ numérique. Vol. 10, issue 1 (3 June 2020), [doi:10.16995/dscn.325](https://doi.org/10.16995/dscn.325)
- TAPoR: **Text Analysis** Portal for Research
- Repo: [github.com/arcualberta/TAPoR](https://github.com/arcualberta/TAPoR)
- outdated software stack, unfinished dependency updates, incomplete or malformed records, missing/broken graphics, broken or obsolete external links
- “Directory Paradox” ([Dombrowski 2021](https://dhdebates.gc.cuny.edu/read/people-practice-power/section/ca87ec4c-23a0-452d-8595-7cfd7e8d6f0c))

<br />

- jointly sustained by DARIAH, CLARIN, and CESSDA

# Best Practices

--

### The Endings Project

<br />

[endings.uvic.ca](https://endings.uvic.ca/)

--

### Principles for Digital Longevity

<br />

- **Data**: open standards (e.g. TEI), version control, continual validation
- **Documentation**: document data models and controlled vocabularies, clarify rights and licences, prefer open licences
- **Processing**: version control, relentless validation, continuous integration (changes to the source data trigger an entire rebuild of the site)
- **Products**: prefer static websites, avoid databases and server-side dependencies, use durable web standards (HTML, CSS, JavaScript), design for graceful failure (pages should still work even in the absence of JavaScript or CSS support)
- **Release management**: planned, discrete releases rather than rolling releases, version and date every release, provide citation instructions, maintain persistent URLs

[endings.uvic.ca/principles.html](https://endings.uvic.ca/principles.html)

### Dynamic Graph of “The Merchant of Venice”

<video data-autoplay src="images/der-kaufmann-von-venedig_dynamic-graph.mp4" style="height:520px;"></video>

### DraCor and the Model Context Protocol (MCP)

<br />

- Combining the strengths of TEI encoding, API access and the ‘knowledge’ of large language models? MCP!
- an open standard for connecting AI models to external data and tools:
  - [‘Think of MCP like a USB-C port for AI applications.’](https://modelcontextprotocol.io/docs/getting-started/intro)
- standard proposed by Anthropic in November 2024

--

### DraCor MCP Server

<br />

- Ingo Börner (2025): *DraCor MCP Server* (Version 1.0.0-beta.1) \[Computer software\]. GitHub. https://github.com/dracor-org/dracor-mcp
- When an LLM is asked about dramatic texts, the LLM can …
  - access resources such as corpora, plays, characters and networks
  - use tools to search, compare and analyse plays
  - provide (interactive) visualisations based on this data
- the DraCor API is publicly accessible (no authentication required)

### DraCor Sustainability

<br />

- DraCor’s code and corpora are hosted in a GitHub organisation
- automated dependency updates
- corpora are built and maintained in dedicated repos
- long-term archiving of corpus releases via the GitHub–Zenodo integration, see [ArDraCor repo](https://github.com/dracor-org/ardracor)
- [DraCor community on Zenodo](https://zenodo.org/communities/dracor/records)
