<br />

- aus strukturierten Daten werden regel- und vorlagenbasiert journalistische Texte erzeugt

### EU AI Act, Artikel 50 Absatz 4

<br />

- »Betreiber eines KI-Systems, das Text erzeugt oder manipuliert, der veröffentlicht wird, um die Öffentlichkeit über Angelegenheiten von öffentlichem Interesse zu informieren, müssen offenlegen, dass der Text künstlich erzeugt oder manipuliert wurde. Diese Pflicht gilt nicht, wenn die Verwendung zur Aufdeckung, Verhütung, Ermittlung oder Verfolgung von Straftaten gesetzlich zugelassen ist oder wenn die durch KI erzeugten Inhalte einem Verfahren der menschlichen Überprüfung oder redaktionellen Kontrolle unterzogen wurden und wenn eine natürliche oder juristische Person die redaktionelle Verantwortung für die Veröffentlichung der Inhalte trägt.«
- seit dem 2. August 2026 anzuwenden

<br /><br />¹ Art. 50 Abs. 4 VO (EU) 2024/1689 (EU AI Act). ([URL](https://eur-lex.europa.eu/eli/reg/2024/1689/oj/deu))
<!-- .element: style="font-size:0.65em; text-align:left;" -->

### Stand der Dinge

<br />

- »Es ist also kein Problem, dass der Journalismus noch keinen Fahrplan für den Umgang mit KI hat?«¹
- »\[Es\] ist mein Eindruck, dass längst nicht ausreichend definiert ist, welche KI-Tools wie genau in der Redaktion angewendet werden. \[…\] Journalistinnen und Journalisten geben in Befragungen immer wieder an, dass sie gerne konkrete Anweisungen hätten.«²
- »Wir erforschen momentan an der TU Dortmund, wie man die KI-Nutzung im Journalismus transparent kennzeichnen kann. Aus unserer bisherigen Forschung wissen wir, dass viele Menschen sich eine einheitliche Kennzeichnung wünschen.«³

### Hin und Her

- zurück zum Vortragstitel: »In \[der F.A.Z.\] sollen nur von Menschen […] verfasste Originalbeiträge stehen.«
- hält die Zeitung das durch?
- vgl. das Zurückrudern von der Rechtschreibreform
  - 1. August 1999: die FAZ übernimmt zunächst die neue Rechtschreibung
  - 1. August 2000: die FAZ kehrt demonstrativ zur alten Rechtschreibung zurück
  - 2. Dezember 2006: die FAZ kündigt an, sich wieder weitgehend der reformierten Rechtschreibung anzuschließen
  - 1. Januar 2007: die FAZ stellt erneut um, diesmal auf eine eigene Hausorthografie¹
