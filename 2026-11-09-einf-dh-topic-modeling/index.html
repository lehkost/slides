## Topic Modeling (Definition)

--

### tl;dr (1/2)

<br />

**Topic Modeling** ist ein auf Wahrscheinlichkeitsrechnung basierendes Verfahren zur Erschließung größerer Textsammlungen. Es fasst häufig gemeinsam auftretende Wörter zu sogenannten Topics zusammen und bestimmt, mit welchen Anteilen diese in den einzelnen Texten vertreten sind. Da Topics nur die Wortoberfläche erfassen, sind sie nicht mit Themen gleichzusetzen. Erst die fachkundige Interpretation macht sie aussagekräftig.

<br />

Vgl. Jan Horstmann: [Topic Modeling.](https://fortext.net/routinen/methoden/topic-modeling) In: forText, 15. Januar 2018.
<!-- .element: style="font-size:0.65em;" -->

--

### tl;dr (2/2)

<br />

»In natural language processing, a **topic model** is a type of probabilistic, neural, or algebraic model for discovering the abstract topics that occur in a collection of documents. Topic modeling is a frequently used text mining tool for <br />discovering hidden semantic features and structures in a text.«

<br />

Wikipedia-Autor\*innen: Topic model. In: Wikipedia: The Free Encyclopedia, 11. August 2026, [en.wikipedia.org/w/index.php?title=Topic_model&oldid=1368892185](https://en.wikipedia.org/w/index.php?title=Topic_model&oldid=1368892185).
<!-- .element: style="font-size:0.65em;" -->

<br />Der deutschsprachige Wikipedia-Artikel war lange problematisch; das fing schon bei der Bezeichnung [des Lemmas](https://web.archive.org/web/20261102175221/https://de.wikipedia.org/wiki/Themenmodellierung) an (das allerdings nach vier Jahren seit Bestehen des Artikels vor drei Tagen endlich geändert wurde), vgl. auch [diesen Kommentar](https://de.wikipedia.org/w/index.php?title=Diskussion:Themenmodellierung&oldid=234465715).

### »Topic modeling is …

<br />

… based on the idea that individual documents are made up of **one or more topics**. It uses emerging technologies in computer science to automatically cluster **topically similar documents** by determining the **groups of words** that tend to **co-occur** in them. Most importantly, topic modeling creates topical <br />categories **without a priori subject definitions**.«

<br />

Sharon Block: Doing More with Digitization: An Introduction to Topic Modeling of Early American Sources. <br />In: Common-Place: The Interactive Journal of Early American Life. Band 6, Nr. 2 (Januar 2006). ([URL](https://www.common-place-archives.org/vol-06/no-02/tales/))
<!-- .element: style="font-size:0.65em;" -->

### Bag-of-Words-Modell

<br />

- grundlegendes Prinzip des klassischen Topic Modelings: ein Text wird als Sammlung von Wörtern und deren Häufigkeiten betrachtet
- Wortreihenfolge und Satzbau werden ignoriert
- Beispiel:
  - »Der Hund beißt den Mann.«
  - »Der Mann beißt den Hund.«
- beide Sätze enthalten dieselben Wörter, haben aber eine unterschiedliche Bedeutung
- Konsequenz: Topic Modeling erkennt Muster im Wortgebrauch, versteht aber nicht den Text im menschlichen Sinn

--

### Anwendungsszenarien

<br />

- Information Retrieval: Suche nicht nach Einzelbegriffen, sondern nach Themen / Wortfeldern
- Recommender Systems: Vorschlag thematisch ähnlicher wissenschaftlicher Artikel
- Exploration von Textsammlungen
- literatur- und kulturhistorische Fragestellungen

<br />(Quelle für diese Folie: [Christof Schöch](https://christofs.github.io/topic-modeling-vorlesung/#/2/2).)
<!-- .element: style="font-size:0.65em;" -->

--

### Topic-Modeling-Algorithmus: <br />Die Latent Dirichlet Allocation (LDA)

<br />

- lange Zeit eines der meistverwendeten Topic-Modeling-Verfahren, entwickelt von David M. Blei et al. (Konferenzbeitrag 2001, Zeitschriftenartikel 2003)
- sehr einflussreicher Artikel ([PDF hier](https://www.jmlr.org/papers/volume3/blei03a/blei03a.pdf)), Google Scholar verzeichnet bisher [65.307 Zitationen](https://scholar.google.com/scholar?cites=17756175773309118945) (Stand 02.11.2026)
- LDA = »a generative probabilistic model for collections of discrete data such as text corpora«
- baut auf der [Dirichlet-Verteilung](https://de.wikipedia.org/wiki/Dirichlet-Verteilung) auf (Aussprache: [diʀiˈkleː] oder [diʀiˈʃleː])
- besonders nützlich zur explorativen Untersuchung großer Textsammlungen, zur Ermittlung wiederkehrender Wortgebrauchsmuster und zum Vergleich der Topic-Verteilungen verschiedener Dokumente

--

### Wie LDA funktioniert

<br />

- grundlegende Annahme: jedes Dokument im Korpus enthält eine Reihe von latenten (verborgenen, nicht direkt beobachtbaren) Topics, deren Verteilung LDA schätzt
- Präprozessierung: Festlegung, welche Texteinheiten als Dokumente gelten (z. B. ganze Romane, Kapitel oder Szenen)
- Forschende müssen mit den Modellparametern experimentieren:
  - die Anzahl der Topics muss vorher bestimmt werden
  - die Anzahl der Iterationen kann festgelegt werden
  - auf Grundlage der Ergebnisse können die Parameter angepasst werden

---

### Wie kommt LDA zu diesem Ergebnis?

<br />

- **Schritt 1:** jedes Wort im Korpus wird zufällig einem Topic zugeteilt
- **Schritt 2:** der Algorithmus geht das Korpus Wort für Wort durch und prüft für jedes Wort neu, welches Topic am besten passt
  - welches Topic ist im selben Dokument schon stark vertreten?
  - welchem Topic ist dieses Wort im übrigen Korpus häufig zugeteilt?
- **Schritt 3:** Schritt 2 wird viele Male wiederholt; jeder vollständige Durchgang durch das Korpus heißt *Iteration* (bei MALLET sind es standardmäßig 1.000 Iterationen)
- dieses Verfahren heißt *Gibbs Sampling* und wird z. B. von MALLET verwendet; andere Implementierungen (etwa Gensim) nutzen andere Schätzverfahren für dasselbe LDA-Modell

--

### Iterationen am Beispiel (2/4): <br />Ein Schritt im Detail

<br />

Soll <span class="t2">goethe</span> in Dokument 2 bei Topic 2 bleiben?

<br />

- Welches Topic ist in Dokument 2 sonst vertreten? <br /><span class="t1">cervantes</span> → Topic 1
- Welchem Topic ist »goethe« anderswo zugeteilt? <br />Dokument 1 und 7 → beide Topic 1
- beides spricht für Topic 1 → »goethe« wechselt mit hoher Wahrscheinlichkeit zu <span class="t1">Topic 1</span>
- LDA entscheidet nicht starr, sondern zieht das neue Topic mit gewichteten Wahrscheinlichkeiten, weshalb der Zufall bis zum Schluss mitspielt

### Konsequenzen der Zufallsbasis

<br />

- bei zu wenigen Iterationen bleiben Topics unscharf und gemischt
- jeder Lauf beginnt mit einer anderen zufälligen Zuteilung, daher weichen die Ergebnisse leicht voneinander ab
- ein fester Zufallsstartwert (*seed*) hilft, Ergebnisse reproduzierbar zu machen; für eine vollständige Reproduktion müssen außerdem Daten, Vorverarbeitung, Modellparameter und Softwareumgebung übereinstimmen

--

### Präprozessierung

<br />

- **Tokenisierung**: Zerlegung eines Textes in Wörter, Symbole usw.
- **Stemming** (Stammformreduktion): regelbasierte Kürzung von Wörtern auf einen gemeinsamen Wortstamm (z. B. »spielen«, »spielte«, »spielend« → »spiel«)
- **Lemmatisierung** (Grundformreduktion): Rückführung flektierter Wörter auf ihre grammatische Grundform (z. B. »ging«, »gegangen«, »geht« → »gehen«)
- Eliminierung von **Stoppwörtern**: anders als bei der Stilometrie sind häufige Funktionswörter beim Topic Modeling oft hinderlich
- **Chunking**: Aufteilung eines Textes in kleinere Portionen (chunks)

--

### Was ist ein »Dokument«?

<br />

- LDA berechnet Topic-Anteile pro Dokument; was als Dokument gilt, legen die Forschenden fest
- ohne Chunking: jeder als Untersuchungseinheit ausgewählte Text (z. B. ein Roman) bildet ein Dokument
  - Problem: bei stark unterschiedlichen Textlängen können lange Texte mehr Topics enthalten und die Modellierung stärker beeinflussen als kurze Texte
- mit Chunking: Texte werden in gleich große Abschnitte zerlegt (z. B. à 1.000 Wörter); jeder Abschnitt ist für LDA ein eigenes Dokument
  - Ergebnisse lassen sich anschließend wieder pro Text zusammenfassen (z. B. Durchschnitt der Topic-Anteile aller Abschnitte eines Romans)
- manchmal gibt das Material natürliche Einheiten vor, z. B. die Tagebucheinträge von Martha Ballard

### Ein Topic ist keine Themenüberschrift

<br />

- ein Topic ist eine Wahrscheinlichkeitsverteilung über Wörter, keine fertige inhaltliche Kategorie
- Beispiel eines fiktiven Topics:
  - `brief herz liebe hand tränen schreiben mutter`
- mögliche Interpretationen:
  - »Liebeskommunikation«?
  - »Briefverkehr innerhalb einer Familie«?
- das Modell liefert Wörter; die Forschenden vergeben die Bezeichnungen
- dieselbe Wortliste kann je nach Korpus und Kontext unterschiedlich interpretiert werden

### Wie überprüft man ein Topic?

<br />

1. Wortliste betrachten: welche Wörter sind für das Topic besonders typisch?
2. Dokumente identifizieren: in welchen Texten ist das Topic besonders stark vertreten?
3. Close Reading: einige dieser Texte bzw. Textstellen tatsächlich lesen
4. Interpretieren: passt die vermutete Themenbezeichnung zu den Texten?
5. Robustheit prüfen: taucht das Muster auch bei anderen Modellparametern und Modellläufen auf?

<br />→ Topic Modeling ersetzt keine Interpretation, <br />sondern eröffnet neue Wege zu ihr.

## Topic Modeling von <br />Martha Ballards Tagebuch

<br />

Cameron Blevins: *Topic Modeling Martha Ballard’s Diary.* <br />In: cblevins.github.io, 1. April 2010. ([URL](https://cblevins.github.io/posts/topic-modeling-martha-ballards-diary/))

### Wer war Martha Ballard?

<br />

- Hebamme in Hallowell, Maine
- führte zwischen 1785 und 1812 ein Tagebuch mit insgesamt fast 10.000 Einträgen
- darunter Aufzeichnungen zu vielen hunderten Geburten, Krankheiten, zur Haus- und Gartenarbeit, Familienleben, Nachbarschaftskonflikten
- typischer Eintrag im Originalduktus, vom 9. Februar 1808 (via [dohistory.org](https://dohistory.org/diary/1808/02/18080201_txt.html)):

<br />

> »Snowd. I have done the most of my hous work and knit Some.«
<!-- .element: style="font-size:0.85em;" -->

--

### Hintergrund

<br />

- Laurel Thatcher Ulrich: **A Midwife’s Tale. The Life of Martha Ballard, Based on Her Diary, 1785–1812.** New York: Knopf 1990.
- Pulitzer Prize for History 1991

### Cameron Blevins’ Blogpost (2010)

<br />

- damals Doktorand an der Stanford University (PhD in American History)
- ins Topic Modeling eingeführt durch Matthew L. Jockers

- auch bei historischer, uneinheitlicher Orthografie kann Topic Modeling sinnvolle Ergebnisse liefern

### Methodologischer Beitrag

<br />

Blevins ([rückblickend, 2015](https://cblevins.github.io/posts/perpetual-sunrise-methodology/)):

> »It is, without a doubt, the single most widely read piece of historical writing I have ever produced. But guess what? Outside of the method, there isn’t anything new or revelatory in it. <br /><br />People seized on this blog post not because of its historical contributions, but because of its methodological contributions. It was like a magic trick, showing how topic modeling could ingest ten thousand diary entries and, in a matter of seconds, tell you what the major themes were in those entries and track them over time, all without knowing the meaning of a single word. The post made people excited for what topic modeling **could** do, not necessarily what it **did** do; the methodology’s potential, not its results.«
<!-- .element: style="font-size:0.75em; text-align:left;" -->

### Topic Modeling in der LLM-Ära

<br />Was bleibt von Topic Modeling, wenn man ein Korpus auch viel niedrigschwelliger an einen KI-Chatbot übergeben kann?

<br />

<div class="columns">
<div class="column">

**LLMs**

- können Kontexte berücksichtigen: Synonyme, Ironie, auch implizite Themen
- mehrsprachig, ohne vorheriges Training auf dem Korpus
- liefern direkt lesbare Themenbezeichnungen (deren Eignung allerdings immer geprüft werden muss)
- Nachteile: begrenztes Kontextfenster, Ergebnisse prompt­abhängig und nicht deterministisch, Halluzinationen, meist proprietär

</div>
<div class="column">

**Klassisches Topic Modeling (LDA)**

- Topics werden aus den Wortverteilungen des untersuchten Korpus geschätzt, ohne vorgegebene Topics
- beziffert Topic-Anteile pro Dokument (ermöglicht Vergleiche und Zeitreihen)
- offen, lokal lauffähig, reproduzierbar bei festem Seed sowie identischen Daten, Parametern und identischer Software
- Nachteile: nur Wortoberfläche (Bag-of-Words), Topics müssen interpretiert werden

</div>
</div>

--

### Neue Ansätze: Embeddings &amp; LLMs

<br />

- Embeddings: Wörter oder Texte werden als Zahlenreihen dargestellt, sodass Bedeutungsähnliches nahe beieinander liegt, auch bei unterschiedlichen Wörtern (z. B. »Arzt« und »Ärztin«, »Theater« und »Bühne«); Bag-of-Words zählt dagegen nur, welche Wörter vorkommen
- moderne Topic-Modeling-Verfahren können Embeddings nutzen, um inhaltlich ähnliche Texte zu gruppieren; zur Beschreibung der gefundenen Topics werden teilweise weiterhin Wortstatistiken verwendet
  - Top2Vec ([Angelov 2020](https://doi.org/10.48550/arXiv.2008.09470))
  - BERTopic ([Grootendorst 2022](https://doi.org/10.48550/arXiv.2203.05794)): gruppiert bedeutungsähnliche Texte; ein LLM kann den Gruppen anschließend Namen geben
- ganz per Prompt: TopicGPT ([Pham et al. 2024](https://doi.org/10.48550/arXiv.2311.01449)) lässt ein LLM die Topics direkt finden und benennen

---

### Takeaways: Topic Modeling

<br />

- Topic Modeling entdeckt statistische Muster im gemeinsamen Auftreten von Wörtern in großen Textsammlungen
- Topics sind keine Themen im geisteswissenschaftlichen Sinn; sie müssen interpretiert werden
- Korpusauswahl, Präprozessierung und Modellparameter beeinflussen die Ergebnisse
- die Interpretation muss durch Close Reading und Robustheitsprüfungen abgesichert werden
- der wissenschaftliche Mehrwert entsteht nicht allein durch die Berechnung, sondern durch die Interpretation der Ergebnisse
