## In Light of Current Events

<br />

* Nan Z. Da: The Computational Case against Computational Literary Studies. *Critical Inquiry* 45:3 (Spring 2019), pp.&nbsp;601–639. DOI:[10.1086/702594](https://doi.org/10.1086/702594).
* controversial debate to say the least; one bigger shortcoming is the total neglect of non-American scholarship in the field, cf. [statement of ADHO’s SIG-DLS](https://culturalanalytics.org/2019/05/response-by-the-special-interest-group-on-digital-literary-stylistics-to-nan-z-das-study/)
* a point well made and generally accepted regards the replication crisis: „the process of requesting complete, runnable codes and quantitative results […] took me **nearly two years**“

--

## Previously on …
### Drama Studies (2014–2018)

<br />

- objective: digital analysis of corpora of dramatic texts
- Python super script [***dramavis***](https://github.com/lehkost/dramavis) (2014–2018)
  - all-in-one approach: maintenance costs too high
- although script and corpora are openly accessible, it was still hard to reproduce our findings or use our code for own experiments

# Chapter 1.

<br />

### TEI Corpus Work

--

## **DraCor**

<br />

- sustainable research projects require (and generate) infrastructure
- DraCor: Drama Corpora Platform ([dracor.org](https://dracor.org/))
- two in-house corpora:
  - German Drama Corpus, GerDraCor (1730s–1930s)
  - Russian Drama Corpus, RusDraCor (1740s–1940s)

--

## Frontend dracor.org

![DraCor-Frontpage)](images/dracor-frontpage.png)<!-- .element: style="width:840px;" -->

[dracor.org](https://dracor.org/) (public beta!)
<!-- .element: style="font-size:0.65em;" -->

--

## GerDraCor + RusDraCor

<br />

- based on reliable sources (for Russian plays: lib.ru, rvb.ru, ilibrary.ru, …)
- page numbers map to the scans of the corresponding pages of the used edition
- converted to TEI-P5
- added ```<particDesc>``` to assemble all speakers, even the functional or ephemeral characters not featured in cast lists
- added Wikidata IDs for authors and plays
- example: Pushkin’s [*Boris Godunov*](https://dracor.org/rus/pushkin-boris-godunov)

--

## ShakeDraCor

<br />

- derived from [Shakespeare Folger Library](https://www.folgerdigitaltexts.org/)
- simple XQuery script to adapt the corpus to the platform
- example: [*Hamlet*](https://dracor.org/shake/hamlet)

--

## SpanDraCor

<br />

- „Biblioteca Electrónica Textual del Teatro en Español de 1868–1936“ (BETTE)
- 25 plays by 8 authors
- forked from their [GitHub repo](https://github.com/GHEDI/BETTE), minimal adaptations to connect to DraCor
- our visualisations and API-fication led to correction of hitherto unknown (structural) bugs
- example: Valle Inclán’s [*Águila de blasón*](https://dracor.org/span/valle-aguila)

--

## GreekDraCor

<br />

- derived from [Perseus Digital Library](http://www.perseus.tufts.edu/hopper/)
- 39 plays of Greek antiquity downloaded from [their website](http://www.perseus.tufts.edu/hopper/opensource/download) (licenced under CC BY-SA 3.0)
- convert Betacode to Unicode (using Python package [betacode 0.2](https://pypi.org/project/betacode/))
- example: Aristophanes’s [*Frogs*](https://dracor.org/greek/aristophanes-frogs)

--

## DraCor API (1/2)

<br />

- provides metadata, bespoke excerpts and various metrics
- live documentation via Swagger: [dracor.org/doc/api](https://dracor.org/doc/api)

--

## DraCor API (2/2)

<br />

- list of available corpora and their content (list of all plays)
- metadata and network data for all plays in CSV or GEXF format
- list of speaking characters per play (usually much more comprehensive than the *dramatis personae*!)
- characters per segment of a play (*dynamic graphs*!)
- spoken text (total/female/male, or per character)
- stage directions
- SPARQL endpoint
- …

--

## Example
#### Number of characters per play in chronological order (1/2)

<br />

```R
library(data.table)
library(ggplot2)
rusdracor <- fread("https://dracor.org/api/corpora/rus/metadata.csv")
ggplot(rusdracor[], aes(x = year, y = numOfSpeakers)) + geom_point()
```

<br />

Very simple R script.

# Chapter 3.

## Programmable Corpora

--

## The Concept

<br />

- analogy to the IT news platform *ProgrammableWeb* (slogan: „APIs, Mashups and the Web as Platform“)
- corpora as comparable objects that offer functions themselves and are linked to other data sources (via LOD)
- FAIR principles, better reproducibility
- you can connect to the platform at any level (TEI, API, R, Python, SPARQL, …)
