### Fraktur

<br />

- gehört zu den gebrochenen Schriften
- entstanden im frühen 16. Jahrhundert
- im deutschsprachigen Buchdruck bis ins 20. Jahrhundert hinein weit verbreitet
- Fraktur ist keine eigene Sprache und kein eigenes Alphabet, sondern eine Schriftart des lateinischen Alphabets
- nicht zu verwechseln mit Kurrent oder Sütterlin, das sind Handschriften

--

### Warum ist Fraktur angesichts heutiger Lesegewohnheiten schwer zu lesen?

(siehe das Alphabet auf der Postkarte)

<br />

- ungewohnte Buchstabenformen, besonders bei k, h, f, s, x
- das lange ſ (langes s) sieht für heutige Leser häufig wie ein f aus
- Großbuchstaben sind teilweise besonders schwer zu erkennen
- Ligaturen verbinden mehrere Buchstaben zu einem Zeichen
- hinzu kommt historische Rechtschreibung: Thal, That, seyn, bey
- am besten nicht jeden Buchstaben isoliert entziffern, sondern Wortbilder, Kontext und wiederkehrende Formen nutzen

--

### Fraktur vs. Antiqua

<br />

- Fraktur als »deutsche Schrift«, Antiqua als »lateinische«
- fremdsprachige Wörter und Zitate wurden innerhalb von Frakturtexten oft in Antiqua gesetzt
- Antiqua-Fraktur-Streit: Debatte über nationale und kulturelle Identität
- 1941 ordnete das NS-Regime überraschend den Wechsel zur Antiqua als Normalschrift an
- NB. das Integralzeichen ∫ geht auf Leibniz zurück, der vom langen s (ſ) als Abkürzung für das Wort Summe ausging (lateinisch ſumma)
