### Information Visualization (Infovis)

<br />

»Although scientists had already been making graphs and charts of their data since the early nineteenth century, the ubiquity of computers, the growing programming literacy, and the wealth of data unleashed by networks at the turn of the twenty-first century democratized information visualization, making it a rapidly expanding new area of art and culture. […] Visualization of complex data is well on its way to becoming as important to the twenty-first century as photography and film were to the twentieth century.«

<br />

Lev Manovich, Vorwort zu Manuel Limas Band *Visual Complexity*, 2011
<!-- .element: style="font-size:0.65em;" -->

--

### Die Sprache der Infovis

<br />

- die [grafischen Primitive](https://de.wikipedia.org/wiki/Grafisches_Primitiv) sind immer noch dieselben: Punkte, Linien, Kurven, einfache Formen
- Visualisierung ist immer eine Kombination aus drei Dingen: Wissenschaft, Design, Kunst
- Ziel: Daten verstehen (Muster, Beziehungen, Strukturen)
- Infovis ist eine (neue) Methode neben anderen

vgl. Lev Manovich, ebd.
<!-- .element: style="font-size:0.65em;" -->

--

### Bertins visuelle Variablen (1967)

<br />

- zwei Dimensionen der Ebene: Position (x, y)
- sechs »retinale« Variablen: Größe, Helligkeit, Muster, Farbe, Richtung, Form
- nicht jede Variable taugt für jede Datenart (Farbe ordnet nicht, Größe schon)

--

### Visualisierung zu Analysezwecken

<br />

»The graphic is no longer only the ›representation‹ of a final simplification, it is a point of departure for the discovery of these simplifications and the means for their justification. The graphic has become, by its manageability, an instrument for information processing.«

<br />

Jacques Bertin: *Semiology of Graphics* \[Orig. 1967\], 1983, S.&nbsp;4
<!-- .element: style="font-size:0.65em;" -->

--

### Wahrnehmung im Experiment

<br />

- Cleveland/McGill 1984: Welche Ableseaufgaben gelingen wie genau?
- hypothetische Rangfolge für Zahlenwerte:
  1. Position auf gemeinsamer Skala
  2. Position auf getrennten Skalen
  3. Länge, Richtung, Winkel
  4. Fläche
  5. Volumen, Krümmung
  6. Schattierung, Farbsättigung
- experimentell geprüft: Position schlägt Länge und Winkel (Balken vs. Torte)
- Farbton und Textur sind für die präzise Ablesung quantitativer Werte weniger geeignet; sie dienen vor allem der kategorialen Unterscheidung (so schon Bertin)

<br />William S. Cleveland, Robert McGill: Graphical Perception: Theory, Experimentation, and Application to the Development of Graphical Methods. In: Journal of the American Statistical Association 79 (1984), S. 531–554, hier S. 536. ([doi:10.1080/01621459.1984.10478080](https://doi.org/10.1080/01621459.1984.10478080))
<!-- .element: style="font-size:0.55em;" -->

--

### Grammar of Graphics

<br />

- Leland Wilkinson: *The Grammar of Graphics* (1999; 2. Aufl. 2005, [doi:10.1007/0-387-28695-0](https://doi.org/10.1007/0-387-28695-0))
- Diagramm = Daten + Zuordnung (Variable → visuelle Variable) + Geometrie + Skalen + Koordinatensystem
- kein Katalog von Diagrammtypen, sondern ein Baukasten
- lebt fort in [ggplot2](https://ggplot2.tidyverse.org/) (R), [Vega-Lite](https://vega.github.io/vega-lite/)/[Altair](https://altair-viz.github.io/), [Observable Plot](https://observablehq.com/plot/), [plotnine](https://plotnine.org/)

### Dimensionen der »Carte figurative«

<br />

- Geografie: Karte mit Einmarsch und Rückzug der Grande Armée (beige und schwarz), einschließlich Gabelung und Zusammenschluss der Truppen
- Breite als Indikator der abnehmenden Truppenstärke <br />(von 422.000 auf ca. 10.000)
- Marschrichtung (Farbe) und zeitlicher Verlauf (Datumsangaben beim Rückzug)
- Temperaturkurve während des Rückzugs, in Grad Réaumur <br />(−30 °R = −37,5 °C)
- nach Tufte: sechs Variablen auf einem Blatt (*Visual Display*, S. 40)

### Graphical Excellence

<br /><br />

»Graphical excellence is that which gives to the viewer the greatest number of ideas in the shortest time with the least ink in the smallest space.«

<br /><br />

*The Visual Display of Quantitative Information*, 2. Auflage [2001], S. 51.
<!-- .element: style="font-size:0.65em;" -->

--

### Tuftes Prinzipien

<br />

- »induce the viewer to think about the substance rather than about methodology, graphic design, the technology of graphic production, or something else«
- »present many numbers in a small space«
- »encourage the eye to compare different pieces of data«
- das Daten/Tinte-Verhältnis maximieren
  - data-ink ratio = (data ink) / (total ink used in the chart)
- »Above all else, show the data.«

<br />Vgl. *The Visual Display of Quantitative Information*, 2. Auflage [2001], S. 13.
<!-- .element: style="font-size:0.8em;" -->

### »Chartjunk«

<br />

- 1983 von Tufte geprägt (vgl. *The Visual Display of Quantitative Information*, [S.&nbsp;106ff.](https://www.edwardtufte.com/notebook/chartjunk/))
- chartjunk = überflüssige oder ablenkende grafische Elemente, darunter redundante Datendarstellungen
- beschreibt drei Arten:
  - unintentional optical art
  - »the dreaded grid«
  - »the self-promoting graphical duck« (nach dem entenförmigen Verkaufsstand [»Big Duck«](https://en.wikipedia.org/wiki/Big_Duck) auf Long Island)

### Diagramme und Schaubilder lesen

<br />

»How to weave together forms of visual and verbal (and – why not? – acoustical, tactile, and olfactory) evidence?«

Jeffrey Schnapp: [*Knowledge Design*](https://jeffreyschnapp.com/wp-content/uploads/2011/06/HH_lectures_Schnapp_01.pdf). Keynote, Herrenhausen-Konferenz »(Digital) Humanities Revisited«, <br />Hannover 2013. VolkswagenStiftung 2014, S. 5f.
<!-- .element: style="font-size:0.65em;" -->

<br />

»Whereas for Augustine reading began with wonder, for digital humanists reading ends in wonder: The object of interest and wonder is less a particular literary text than a visual or diagrammatic unity produced through a method. […] These new diagrams and graphs […] are themselves texts to be read, interpreted, and marveled at.«

Chad Wellmon: [*Sacred Reading: From Augustine to the Digital Humanists.*](https://chadwellmon.files.wordpress.com/2015/11/wellmon-sacred-reading-fall-2015.pdf) <br />In: The Hedgehog Review. Vol. 17, No. 3 (Herbst 2015).

### Daten oder »Capta«?

<br />

- Johanna Drucker: »Humanities Approaches to Graphical Display« ([DHQ 2011](https://doi.org/10.63744/r4ysrh7ae534))
- Daten sind nicht gegeben, sondern genommen: »capta«
- Standarddiagramme behaupten Eindeutigkeit, wo Geisteswissenschaften Unschärfe, Perspektive und Interpretation kennen
- Giorgia Lupi: [»Data Humanism«](https://www.printmag.com/article/data-humanism-future-of-data-visualization/) (2017), [*Dear Data*](https://giorgialupi.com/dear-data) (mit Stefanie Posavec, 2016; Originalpostkarten und Moleskine-Skizzenbücher übergeben ans [MoMA](https://www.moma.org/collection/works/215813))
- Frage an jedes Diagramm: Was wurde gezählt, von wem, wozu?

### Isotype: Wiener Methode der Bildstatistik (2/2)

<br />

- entwickelt 1925–1934 am Gesellschafts- und Wirtschaftsmuseum in Wien, finanziert vom »Roten Wien«
- Team: Otto Neurath (Konzept), Marie Reidemeister (»Transformation« der Daten in Bildentwürfe), Gerd Arntz (Piktogramme)
- Grundregel: größere Menge = mehr Zeichen, nicht größere Zeichen
- Hauptwerk: Atlas [*Gesellschaft und Wirtschaft*](https://resolver.obvsg.at/urn:nbn:at:AT-WBR-125389) (1930) mit 100 Bildtafeln
- seit 1935 unter dem Namen »Isotype« (International System of Typographic Picture Education), im Exil in Den Haag und Oxford
- Nachleben: Piktogramme im öffentlichen Raum, Infografik, Emojis

### D3.js (2011)

<br />

- »Data-Driven Documents«: entwickelt in Stanford von Mike Bostock, Vadim Ogievetsky und Jeffrey Heer, als Nachfolger von [Protovis](https://mbostock.github.io/protovis/) (2009)
- Grundidee: Daten werden direkt an die Elemente einer Webseite gebunden (SVG, HTML, CSS) – Webstandards statt eigenes Grafikformat
- kein Katalog fertiger Diagrammtypen, sondern ein Werkzeugkasten: alles ist möglich, nichts ist voreingestellt
- Durchbruch im Datenjournalismus: Bostock arbeitete bis 2015 als Graphics Editor bei der *New York Times*
- 2021 »Test of Time Award« der IEEE VIS (der wichtigsten Fachkonferenz für Datenvisualisierung); Grundlage von Observable Plot
- live ansehen: [Zoomable Sunburst](https://observablehq.com/@d3/zoomable-sunburst), [D3-Galerie](https://observablehq.com/@d3/gallery)

<br />Michael Bostock, Vadim Ogievetsky, Jeffrey Heer: »D³: Data-Driven Documents«. In: IEEE Transactions on Visualization and Computer Graphics 17 (2011), Nr. 12, S. 2301–2309. ([doi:10.1109/TVCG.2011.185](https://doi.org/10.1109/TVCG.2011.185))

![Porphyrian tree, from Wikipedia](images/porphyrian-tree-from-wikimedia-commons.png)<!-- .element: style="height:456px;" -->

### Die Erfindung der Treemaps

<br />

- Anfang 1990er-Jahre: der Informatiker Ben Shneiderman (U&nbsp;Maryland) suchte eine intuitive Lösung, um die größten Speicherplatzverbraucher auf seiner Festplatte zu finden (Ordner, Dateien)
- neue Visualisierungsmethode: Visualisierung von Hierarchien unter Einbezug des verbrauchten Platzes
- Aufsatz: Ben Shneiderman: [»Tree Visualization with Tree-Maps: 2-d Space-Filling Approach«](https://doi.org/10.1145/102377.115768). In: ACM Transactions on Graphics 11 (1992), Nr. 1, S. 92–99
- seither wurden verschiedene Kachelalgorithmen entwickelt
- Geschichte der Treemap-Forschung: [cs.umd.edu](https://www.cs.umd.edu/hcil/treemap-history/index.shtml)

### Limas 8 Prinzipien (ebd., S.&nbsp;82–95)

<br />

1. Start with a Question
2. Look for Relevancy
   * Inhalt und Visualisierungsmethode müssen passen
3. Enable Multivariate Analysis
   * binäre Semantiken vermeiden und qualitativen Reichtum nutzen
4. Embrace Time
   * »networks are evolving systems«, Abbildung von Zeit in Visualisierungen

--

### Limas 8 Prinzipien (ebd., S.&nbsp;82–95)

<br />

5. Enrich Your Vocabulary<!-- .element: value="5" -->
   * nicht nur Punkte für Knoten und Linien für Kanten (Verwendung von Farben, Formen, unterschiedlichen Größen, Ausrichtungen, Texturen, Positionen)
6. Expose Grouping
   * Kriterien: nach Zeit, nach Ort, nach bestimmten Gemeinsamkeiten, nach einer bestimmten Kategorie
7. Maximize Scaling
   * Makro- vs. Mikroanalyse
8. Manage Intricacy
   * Shneidermans Mantra: »Overview first, zoom and filter, then details on demand.«

### How Charts Lie

<br />

- abgeschnittene und doppelte Achsen, Flächen statt Längen, Rosinenpickerei im Zeitraum
- Tuftes »Lie Factor«: Effekt in der Grafik ÷ Effekt in den Daten (*Visual Display*, S. 57)
- Beispiel: GPT-5-Präsentation, 7. August 2025 – der Balken für 69,1 % ist so hoch wie der für 30,8 %, der für 52,8 % höher als beide (vgl. [FlowingData](https://flowingdata.com/2025/08/07/openai-botches-the-charts-in-gpt-5-introduction/), [The Verge](https://www.theverge.com/news/756444/openai-gpt-5-vibe-graphing-chart-crime))
- kein KI-Fehler, sondern menschliche Eile: Diagrammfehler brauchen keine KI
- vgl. Alberto Cairo: *How Charts Lie* (2019)

### Generative KI und Datenvisualisierung

--

### Einsatzweisen

<br />

- Chat mit Codeausführung: Chatbots schreiben Visualisierungscode (matplotlib, ggplot2, D3 usw.), führen ihn aus und liefern Diagramm plus Interpretation
- Coding-Agenten: erzeugen Diagramme, sehen sich das Ergebnis an und bessern selbstständig nach
- Integration in Tools: KI-Assistenten schlagen Diagrammtypen vor und formulieren Beschriftungen; Chatbots steuern Werkzeuge wie Datawrapper direkt an
- KI als Leserin: Alt-Texte, Zusammenfassungen und Kritik vorhandener Diagramme
- Bildgeneratoren: malen »Infografiken« ohne Datenbindung

--

### Code-Generierung

<br />

- Prompt: »Visualisiere die Erscheinungsjahre in dieser CSV-Datei als gestapeltes Balkendiagramm in ggplot2, gruppiert nach Genre.«
- LLM liefert lauffähigen, kommentierten R-Code und Achsenbeschriftungen
- schnelles Prototyping, kann eine Brücke sein bei fehlender R-/Python-Erfahrung
- Faustregel: je verbreiteter die genutzte Softwarebibliothek (matplotlib, ggplot2, D3), desto verlässlicher der Output

--

### »AI Slop Charts«

<br />

- »slop«: [Wort des Jahres 2025 bei Merriam-Webster](https://www.merriam-webster.com/wordplay/word-of-the-year)
- im Code: erfundene Funktionsnamen, veraltete APIs (besonders bei Nischenbibliotheken)
- in den Daten: erfundene Datenpunkte, wenn das Modell den Datensatz nicht direkt vor Augen hat
- in der Gestaltung: Default-Entscheidungen ohne Reflexion (Tortendiagramme für ungeeignete Daten, kontextlose Heatmaps)
- im Bild: 99 von 100 per Bildgenerator erzeugten Infografiken enthielten mindestens ein irreführendes Element ([Keck et al. 2026](https://doi.org/10.1145/3811427.3811469))
- Merksatz: Zahlen gehören in Code, nicht ins Bildmodell

--

### Können LLMs Diagramme lesen?

<br />

- einfache Ablesefragen: inzwischen ordentlich
- irreführende Diagramme erkennen: deutlich schwächer ([Pandey/Ottley 2025](https://doi.org/10.1111/cgf.70137))
- Gestaltungsfehler werden eher erkannt als Denkfehler in der Bildunterschrift; korrekte Diagramme werden oft fälschlich beanstandet ([Lalai et al. 2026](https://doi.org/10.48550/arXiv.2603.22368))
- Konsequenz: KI-Bildbeschreibungen und -Interpretationen sind Entwürfe, keine Belege

--

### Wo bleibt die menschliche Verantwortung?

<br />

- Fragestellung (Manuel Limas Prinzip »Start with a Question«)
- Datenkenntnis (welche Variablen tragen Bedeutung, wo lauern Bias und Lücken)
- Kontextualisierung (Titel; Entscheidung über Beschriftungen, auch wenn diese von der KI vorgeschlagen werden; interpretative Einbettung)
- kritische Beurteilung: Tuftes Prinzipien bleiben ein Prüfstein, kein Dogma (vgl. »Kritik an Tufte«)
- vgl. auch Prinzip Nr. 6 in D’Ignazio/Klein: *Data Feminism* (2020): »**Consider context.** Data feminism asserts that data are not neutral or objective. They are the products of unequal social relations, and this context is essential for conducting accurate, ethical analysis.« (S. 149)

--

### Praxisempfehlungen

<br />

- erst die Frage formulieren, dann die Daten verstehen, dann den Prompt formulieren
- LLM nicht direkt als Visualisierungsgenerator einsetzen, sondern als Visualisierungsassistent
- Output immer prüfen: stimmen die Achsen? stimmt der Diagrammtyp? stimmen die Zahlen und Beschriftungen?
- Reproduzierbarkeit: den generierten Code speichern und versionieren, nicht nur das fertige Bild
- KI-Nutzung dokumentieren (Werkzeug, Prompt, Datum)
- keine unveröffentlichten Forschungsdaten in fremde Cloud-Dienste laden
- KI verschiebt die Wertschöpfung von der Ausführung zur Beurteilung
