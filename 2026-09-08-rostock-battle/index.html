### Network theory …

<br>

… looks at how things are connected to one another, and shows those connections as points and lines in a network.

--

#### An example of a network graph with <br />8 nodes (also called vertices) and 10 edges:

<br>

<br>

(Source: [Wikimedia Commons](https://commons.wikimedia.org/wiki/File:Small_Network.png))

If a set of data can sensibly be described using nodes and edges, <br />then what we have is network data.

### Social network analysis (SNA) …

<br />

… is a way of studying how people or groups are connected to one another. It uses network theory to help us make better sense of those connections.

--

### Network analysis of dramatic texts <br />as a classic use case <br />for the Digital Humanities

--

## Formalisation

<br />

- Social network data = **interactions** between social entities
- In dramatic texts, for example: »Two characters interact with one another if they both speak within the same section of a play (usually a ›scene‹).« (following an idea by Solomon Marcus, »Poetica matematică«, 1970)

---

### Measures that describe a graph

![Four nodes](images/example_network_graph_four_nodes.svg)<!-- .element: style="height:240px;" -->

| Measure                       | What it means                                                                                    | Value                                       |
| ----------------------------- | ------------------------------------------------------------------------------------------------ | ------------------------------------------- |
| **(a) Network size**          | The number of nodes<!-- .element: class="fragment" -->                                           | **4**<!-- .element: class="fragment" -->    |
| **(b) Network diameter**      | The longest of all the shortest paths between any two nodes<!-- .element: class="fragment" -->   | **2**<!-- .element: class="fragment" -->    |
| **(c) Network density**       | How many of the possible edges actually exist<!-- .element: class="fragment" -->                 | **0.67**<!-- .element: class="fragment" --> |
| **(d) Clustering coefficient**| The average local clustering coefficient across all nodes<!-- .element: class="fragment" -->     | **0.58**<!-- .element: class="fragment" --> |
| **(e) Average path length**   | The average of all shortest paths between every pair of nodes<!-- .element: class="fragment" --> | **1.33**<!-- .element: class="fragment" --> |
| **(f) Maximum degree**        | The largest number of edges meeting at a single node<!-- .element: class="fragment" -->          | **3**<!-- .element: class="fragment" -->    |

<!-- .element: style="font-size:0.65em;" -->

--

(NB. The **clustering coefficient** tells you how closely the <br />neighbours of a node are connected to each other.)

### Where does the network data come from?

![DraCor front page, 18 January 2025](images/dracor_frontpage_2025-01-18.png)

DraCor ([dracor.org](https://dracor.org/)) is a free and open online platform holding the full texts of, and data on, more than 4,000 plays in over 20 languages. It supports digital research into European drama from antiquity onwards.

### Rules of play

<br />

1. The game follows the [Top Trumps](https://en.wikipedia.org/wiki/Top_Trumps) principle.
2. Every match is one against one.
3. The younger player goes first.
4. If the two values called are the same, another value on the current pair of cards is called instead.
5. The game ends as soon as one player has won every card (32:0).
6. Otherwise it ends after 7 minutes, and the cards are counted.
7. If the score is level (16:16), the moderators name one value on the current pair of cards to settle the match.
