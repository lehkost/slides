## Formalist Movement

<br />

- Andrei Bely’s collection of essays, „Symbolism“ (1910)
  - quantitative methods applied to the study of rhythm in poetry
  - a „formalist prior to the formalists in Russia“
- Formalist movement, concept of estrangement (ostranenie)
- Shklovsky’s „Art as Technique“ (1917), looking at structures of literary works
- Moscow Linguistic Circle (1914–1924)

--

## Boris Yarkho (1889–1942)

<br />

- early data-driven formalism
- describing literature as a system of proportions and relations between different features
- development of these structures over time and across genres
- incorporating concepts of biology, comparison to the development of life (evolutionary concepts)
- „Methodology for the Exact Study of Literature“

## Some Popular Corpora/Datasets in Russian DH

<br />

- НКРЯ (Russian National Corpus, 2000–2004): [ruscorpora.ru](https://ruscorpora.ru/)
- Poetic Corpus: [ruscorpora.ru/corpus/poetic](https://ruscorpora.ru/corpus/poetic)
- Other corpora: [ruscorpora.ru/page/corpora-other/](https://ruscorpora.ru/page/corpora-other/)
- Tolstoy Digital, [encoded in TEI](https://github.com/tolstoydigital/TEI) (Tolstoy Museum + HSE Moscow)
- electronic library of Pushkinskiy Dom (classics): [russian-literature.org](https://russian-literature.org/)

--

## Literary Corpora <br />(Enthusiasts, Activists)

<br />

- Maksim Moshkov’s Library (1994–): [lib.ru](https://lib.ru/)
- Internet Library of Aleksey Komarov (1996–): [ilibrary.ru](https://ilibrary.ru/)
- Russian Virtual Library (1999–): [rvb.ru](https://rvb.ru/)
- Fundamental Electronic Library (2002–): [feb-web.ru](https://feb-web.ru/)
- SovLit: [ruthenia.ru/sovlit/](https://ruthenia.ru/sovlit/)
- <a href="https://ru.wikisource.org/">Russian Wikisource</a>
- [wikilivres.org](https://wikilivres.org/)
